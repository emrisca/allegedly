[package]
name = "s08-storage-100m-replay"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { version = "60.2.0", default-features = false, features = ["prettyprint"] }
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "zstd"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rtrb = "0.4.1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
