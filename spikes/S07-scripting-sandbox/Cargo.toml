[package]
name = "s07-scripting-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }
rhai = { version = "1.27.0", features = ["sync"] }
mlua = { version = "0.12.3", features = ["luau"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
