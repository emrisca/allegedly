<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Black to Dark Graphite Gray -->
    <linearGradient id="bgGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#222328"/>
      <stop offset="40%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Glass Rim Bevel Highlight Gradient -->
    <linearGradient id="glassRimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glass Specular Reflection Highlight -->
    <linearGradient id="specularGlint" x1="100%" y1="0%" x2="40%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow for ASCII Characters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Shadow below icon -->
  <rect x="16" y="24" width="480" height="480" rx="112" ry="112" fill="#000000" fill-opacity="0.5" filter="blur(20px)"/>

  <!-- Squircle Glass Container -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Dark Gradient -->
    <rect width="512" height="512" fill="url(#bgGradient)"/>

    <!-- Specular Gloss Arc (Glass look) -->
    <path d="M 180 0 L 512 0 L 512 332 Q 380 260 260 180 Q 180 120 180 0 Z" fill="url(#specularGlint)"/>

    <!-- Subtle Glass Surface Frost / Horizon -->
    <ellipse cx="256" cy="460" rx="280" ry="120" fill="#ffffff" fill-opacity="0.02"/>

    <!-- ASCII Art Capital Letter A -->
    <g filter="url(#neonGlow)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Courier New\", monospace" font-size="34px" font-weight="700" fill="#ffffff" letter-spacing="3px" text-anchor="middle">
      <text x="256" y="152">/ \</text>
      <text x="256" y="194">/@ #%</text>
      <text x="256" y="236">/ | \ | \</text>
      <text x="256" y="278">/-/ _ \-\ </text>
      <text x="256" y="320">/@#%%==+*\</text>
      <text x="256" y="362">/-/    \+\</text>
      <text x="256" y="404">[_]    [*]</text>
    </g>

    <!-- Glass Rim Bevel Stroke -->
    <rect x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="url(#glassRimGradient)" stroke-width="2.5"/>
    <!-- Subtle Inner Border -->
    <rect x="3" y="3" width="506" height="506" rx="112" ry="112" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
</svg>