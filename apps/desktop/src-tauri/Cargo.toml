[package]
name = "allegedly-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Allegedly Tauri v2 desktop shell (macOS + Windows, SV-01 zero-network offline boot)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
allegedly-app = { path = "../../../crates/allegedly-app" }
allegedly-core = { path = "../../../crates/allegedly-core" }
allegedly-ipc = { path = "../../../crates/allegedly-ipc" }
allegedly-replay = { path = "../../../crates/allegedly-replay" }
allegedly-studies = { path = "../../../crates/allegedly-studies" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
