name: CI PR Fast (macOS + Windows)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-guards:
    name: Static Policy Guards (SV-08, ADR-0001, SC-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zero-float financial crate gate (SV-08)
        run: bash scripts/ci/check-no-floats.sh
      - name: Zero retired legacy prefix gate (ADR-0001)
        run: bash scripts/ci/check-no-legacy-prefix.sh
      - name: npm SPDX, dockview-enterprise ban, lockfile & exact pins gate
        run: node scripts/ci/check-npm-policy.mjs

  cargo-deny:
    name: Cargo Deny License & Advisory Gate (SC-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  rust-workspace:
    name: Rust Workspace & Tauri Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting (workspace + Tauri shell)
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Prepare placeholder frontendDist for clean-checkout Tauri compile checks
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          printf '<!doctype html><html><body></body></html>\n' > apps/desktop/dist/index.html
      - name: Clippy (-D warnings, workspace + Tauri shell)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run workspace & Tauri shell tests
        run: |
          cargo test --workspace --release
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  frontend-workspace:
    name: Frontend & UV-01 A11y (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Static npm policy guard
        run: pnpm policy:check
      - name: TypeScript strict typecheck
        run: pnpm typecheck
      - name: Unit tests & Rust golden binary fixture parity (T07)
        run: pnpm test
      - name: WCAG AA axe-core a11y gate (UV-01)
        run: pnpm test:a11y
      - name: Production Vite bundle build (apps/desktop)
        run: pnpm build
